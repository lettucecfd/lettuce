[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lettucecfd"
dynamic = ["version"]
description = "Lattice Boltzmann Python GPU"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andreas Kraemer" },
    { name = "Mario Bedrunka" },
    { name = "Philipp Spelten" },
    { name = "Dominik Wilde" },
    { name = "Robert Fritsch" },
    { name = "Maximilian Bille" },
    { name = "Martin Kliemank" },
]
maintainers = [
    { email = "lettuce.cfd@gmail.com" },
]
keywords = [
    "lattice-boltzmann",
    "lbm",
    "cfd",
    "computational-fluid-dynamics",
    "gpu",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1.7",
    "h5py>=3.11.0",
    "matplotlib>=3.9.2",
    "mmh3>=4.1.0",
    "numpy>=2.1.0",
    "packaging>=24.1",
    "pyevtk>=1.6.0",
    # Needed at runtime by the generated setup.py that builds the native CUDA
    # extension, see lettuce/cuda_native/_template.py.
    "setuptools>=78.1.1",
    "torch>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
]

[project.scripts]
lettuce = "lettuce.cli:main"

[project.urls]
Homepage = "https://github.com/lettucecfd/lettuce"
Documentation = "https://lettucecfd.readthedocs.io"
Repository = "https://github.com/lettucecfd/lettuce"
Issues = "https://github.com/lettucecfd/lettuce/issues"

[tool.setuptools.packages.find]
include = ["lettuce*"]

[tool.setuptools_scm]
# Version comes from the git tag (e.g. "0.2.3"); untagged commits become
# a .devN pre-release of the next patch version.
fallback_version = "0.0.0+unknown"

[project.optional-dependencies]
cpu = [
  "torch>=2.7.0",
]
cu124 = [
  "torch>=2.6.0",
]
cu126 = [
  "torch>=2.7.0",
]
cu128 = [
  "torch>=2.7.0",
]
cu130 = [
  "torch>=2.9.0",
]

[tool.uv]
# The version comes from git (setuptools-scm), so rebuild the project on every
# new commit or tag; otherwise uv reuses a cached build with a stale version.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
    # Korrekte Marker, die an die Extra-Marker gebunden sind.
    # macOS wird standardmäßig auf CPU gesetzt
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32' or sys_platform == 'darwin'"},
    { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
