# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    # You can also specify other tool versions:
    # nodejs: "19"
    # rust: "1.64"
    # golang: "1.19"
  jobs:
    # Read the Docs clones shallowly; setuptools-scm needs the tags to
    # derive the version shown in the documentation.
    post_checkout:
      - git fetch --unshallow --tags || true

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#    - pdf
#    - epub

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
   install:
   # First, so that torch comes from the CPU index (see docs/requirements.txt)
   # and is already satisfied when the package itself is installed.
   - requirements: docs/requirements.txt
   # Runtime dependencies come from pyproject.toml, docs/conf.py imports lettuce.
   - method: pip
     path: .
